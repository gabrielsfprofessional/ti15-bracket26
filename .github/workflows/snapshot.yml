name: Snapshot and uptime

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tournament-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate snapshot
        run: npm run snapshot

      - name: Commit changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/tournament.json; then
            echo "Tournament payload unchanged; skipping commit and Vercel deploy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournament.json
          git commit -m "chore(data): refresh tournament snapshot"
          git push

      - name: Check production API
        run: npm run uptime
