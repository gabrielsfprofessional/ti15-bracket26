name: Snapshot and uptime

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate snapshot
        run: npm run snapshot

      - name: Commit changed snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/tournament.json; then
            echo "Tournament payload unchanged; skipping commit and Vercel deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournament.json
          git commit -m "chore(data): refresh tournament snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify production API and deployed commit
        env:
          UPTIME_EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: npm run uptime
